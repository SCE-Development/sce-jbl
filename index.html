<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCE JBL Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            padding: 10px 15px;
            margin-right: 5px;
            margin-bottom: 5px;
            cursor: pointer;
        }
        #message {
            margin-top: 10px;
            padding: 10px;
            display: none;
        }
        .success {
            background: lightgreen;
        }
        .error {
            background: lightcoral;
        }
    </style>
</head>
<body>
    <div>
        <h1>SCE JBL Player</h1>
        
        <input type="text" id="urlInput" placeholder="Enter YouTube URL...">
        
        <div>
            <button onclick="playNow()">Play Now</button>
            <button onclick="addToQueue()">Add To Queue</button>
            <button onclick="skipSong()">Skip</button>
            <button onclick="stopPlayback()">Stop</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:6969';

        function showMessage(text, isError = false) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = isError ? 'error' : 'success';
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }

        async function playNow() {
            const url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                showMessage('Please enter a YouTube URL', true);
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/queue`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        play_immediately: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                showMessage(data.message || 'Playing now!');
                document.getElementById('urlInput').value = '';
                
            } catch (error) {
                showMessage(`Error: ${error.message}`, true);
            }
        }

        async function addToQueue() {
            const url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                showMessage('Please enter a YouTube URL', true);
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/queue`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        play_immediately: false
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                showMessage(data.message || 'Song queued successfully!');
                document.getElementById('urlInput').value = '';
                
            } catch (error) {
                showMessage(`Error: ${error.message}`, true);
            }
        }

        async function skipSong() {
            try {
                const response = await fetch(`${API_URL}/skip`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                showMessage(data.message || 'Skipped to next song!');
                
            } catch (error) {
                showMessage(`Error: ${error.message}`, true);
            }
        }

        async function stopPlayback() {
            try {
                const response = await fetch(`${API_URL}/stop`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                showMessage(data.message || 'Playback stopped!');
                
            } catch (error) {
                showMessage(`Error: ${error.message}`, true);
            }
        }

        // Allow pressing Enter to play now
        document.getElementById('urlInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                playNow();
            }
        });
    </script>
</body>
</html>
